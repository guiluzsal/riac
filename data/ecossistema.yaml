  descricao: >-
    Centro de Estudos, Resposta e Tratamento de Incidentes de Segurança no
    Brasil, mantido pelo NIC.br. Trata incidentes de segurança envolvendo
    redes brasileiras e publica estatísticas, alertas e recomendações.
  tipo: instituicao
  tags: [csirt, brasil]
  verificado_em: 2026-10-23

- nome: CTIR Gov
  url: https://www.gov.br/gsi/pt-br/seguranca-da-informacao-e-cibernetica
  descricao: >-
    Centro de Prevenção, Tratamento e Resposta a Incidentes Cibernéticos de
    Governo, vinculado ao GSI/PR, responsável por coordenar a resposta a
    incidentes na administração pública federal brasileira.
  tipo: instituicao
  tags: [governo, brasil]
  verificado_em: 2026-10-23

- nome: CAIS/RNP
  url: https://www.rnp.br/servicos/cais
  descricao: >-
    Centro de Atendimento a Incidentes de Segurança da RNP (Rede Nacional
    de Ensino e Pesquisa), um dos primeiros CSIRTs do Brasil, atuante na
    rede acadêmica nacional.
  tipo: instituicao
  tags: [csirt, academico, brasil]
  verificado_em: 2026-10-23

- nome: LGPD
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/lgpd/
  descricao: >-
    Lei Geral de Proteção de Dados Pessoais, Lei nº 13.709, de 14 de
    agosto de 2018, que disciplina o tratamento de dados pessoais no
    Brasil e cria a Agência Nacional de Proteção de Dados (ANPD).
    Referência central para a interseção entre CTI e privacidade,
    sobretudo em notificação de incidentes e vazamentos de dados.
    Texto integral disponível no RIAC.
  tipo: legislacao
  tags: [lei, privacidade, anpd, brasil]
  verificado_em: 2026-10-24

- nome: Convenção de Budapeste
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/convencao-de-budapeste/
  descricao: >-
    Convenção sobre o Crime Cibernético, firmada em Budapeste em 23 de
    novembro de 2001 e promulgada no Brasil pelo Decreto nº 11.491, de
    12 de abril de 2023. Primeiro tratado internacional dedicado à
    tipificação de crimes cibernéticos e à cooperação internacional
    para investigação e obtenção de provas eletrônicas. Texto integral
    disponível no RIAC.
  tipo: legislacao
  tags: [decreto, tratado-internacional, cooperacao-internacional, brasil]
  verificado_em: 2026-10-24

- nome: E-Ciber
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/e-ciber/
  descricao: >-
    Estratégia Nacional de Cibersegurança, instituída pelo Decreto nº
    12.573, de 4 de agosto de 2025, em quatro eixos temáticos (proteção e
    conscientização, segurança e resiliência, cooperação e integração,
    soberania e governança). Revoga o decreto de 2020. Texto integral
    disponível no RIAC.
  tipo: legislacao
  tags: [decreto, estrategia, gsi, brasil]
  verificado_em: 2026-10-24

- nome: PNCiber
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/pnciber/
  descricao: >-
    Política Nacional de Cibersegurança, instituída pelo Decreto nº
    11.856, de 26 de dezembro de 2023, que também cria o Comitê Nacional
    de Cibersegurança (CNCiber). Define princípios, objetivos e
    instrumentos (Estratégia e Plano Nacional de Cibersegurança) que
    orientam a E-Ciber. Texto integral disponível no RIAC.
  tipo: legislacao
  tags: [decreto, politica, gsi, brasil]
  verificado_em: 2026-10-24

- nome: PNSI
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/pnsi/
  descricao: >-
    Política Nacional de Segurança da Informação, instituída pelo
    Decreto nº 12.572, de 4 de agosto de 2025, no âmbito da
    administração pública federal. Cria o Comitê Gestor da Segurança da
    Informação e revoga o Decreto nº 9.637/2018 e normas relacionadas.
    Texto integral disponível no RIAC.
  tipo: legislacao
  tags: [decreto, politica, gsi, brasil]
  verificado_em: 2026-10-24

- nome: REGIC
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/regic/
  descricao: >-
    Rede Federal de Gestão de Incidentes Cibernéticos, instituída pelo
    Decreto nº 10.748, de 16 de julho de 2021, para coordenar prevenção,
    tratamento e resposta a incidentes cibernéticos entre órgãos e
    entidades da administração pública federal, sob coordenação do
    GSI/CTIR Gov. Texto integral disponível no RIAC.
  tipo: legislacao
  tags: [decreto, gsi, ctir-gov, brasil]
  verificado_em: 2026-10-24

- nome: Lei Carolina Dieckmann
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/lei-carolina-dieckmann/
  descricao: >-
    Lei nº 12.737, de 30 de novembro de 2012, que tipifica delitos
    informáticos ao inserir os arts. 154-A e 154-B no Código Penal
    (invasão de dispositivo informático), além de alterar os arts. 266 e
    298. Batizada em referência ao caso da atriz Carolina Dieckmann.
    Texto integral disponível no RIAC.
  tipo: legislacao
  tags: [lei, codigo-penal, invasao-de-dispositivo, brasil]
  verificado_em: 2026-10-24

- nome: Lei nº 14.155/2021
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/lei-14155-2021/
  descricao: >-
    Lei nº 14.155, de 27 de maio de 2021, que altera o Código Penal para
    tornar mais graves os crimes de invasão de dispositivo informático,
    furto mediante fraude eletrônica e estelionato (inclusive fraude
    eletrônica e estelionato contra idoso ou vulnerável) cometidos de
    forma eletrônica ou pela internet, e altera o Código de Processo
    Penal para definir a competência em modalidades de estelionato.
    Texto integral disponível no RIAC.
  tipo: legislacao
  tags: [lei, codigo-penal, estelionato, fraude, brasil]
  verificado_em: 2026-10-24

- nome: Marco Civil da Internet
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/marco-civil-da-internet/
  descricao: >-
    Lei nº 12.965, de 23 de abril de 2014, que estabelece princípios,
    garantias, direitos e deveres para o uso da internet no Brasil,
    incluindo neutralidade de rede, proteção à privacidade e aos dados
    pessoais, guarda de registros de conexão e de acesso a aplicações, e
    responsabilidade de provedores por conteúdo de terceiros. Texto
    integral disponível no RIAC.
  tipo: legislacao
  tags: [lei, neutralidade-de-rede, registros-de-conexao, brasil]
  verificado_em: 2026-10-24

- nome: Resolução CD/ANPD nº 15/2024
  url: https://guiluzsal.github.io/riac/ecossistema/legislacao/resolucao-cd-anpd-15-2024/
  descricao: >-
    Aprova o Regulamento de Comunicação de Incidente de Segurança,
    editado pelo Conselho Diretor da ANPD com base no art. 48 da LGPD.
    Define critérios de risco ou dano relevante, prazos de três dias
    úteis para comunicar incidentes à ANPD e aos titulares, conteúdo
    mínimo da comunicação e registro de incidentes. Texto integral
    disponível no RIAC.
  tipo: legislacao
  tags: [resolucao, anpd, incidente, brasil]
  verificado_em: 2026-10-24
