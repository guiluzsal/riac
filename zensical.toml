[project]
site_name = "REPOSITÓRIO DE INTELIGÊNCIA DE AMEAÇAS CIBERNÉTICAS"
site_url = "https://guiluzsal.github.io/riac/"
site_description = "Repositório de Inteligência de Ameaças Cibernéticas"

repo_url = "https://github.com/guiluzsal/riac"
repo_name = "guiluzsal/riac"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Início" = "index.md" },
  { "Recursos" = [
      { "Ator" = "recursos/ator.md" },
      { "Domínio" = "recursos/dominio.md" },
      { "Ferramenta" = "recursos/ferramenta.md" },
      { "Hacktivismo" = "recursos/hacktivismo.md" },
      { "IOC" = "recursos/ioc.md" },
      { "IP" = "recursos/ip.md" },
      { "Malware" = "recursos/malware.md" },
      { "Ransomware" = "recursos/ransomware.md" },
      { "Varredura" = "recursos/varredura.md" },
      { "Vazamentos" = "recursos/vazamentos.md" },
      { "Vulnerabilidade" = "recursos/vulnerabilidade.md" },
  ] },
  { "Verbetes" = [
      { "Modelos de intrusão" = [
          { "Modelo Diamante (Diamond Model)" = "verbetes/diamond-model.md" },
          { "Cadeia de Ataque Cibernética (Cyber Kill Chain)" = "verbetes/cyber-kill-chain.md" },
          { "Courses of Action Matrix" = "verbetes/courses-of-action-matrix.md" },
          { "Pirâmide da Dor (Pyramid of Pain)" = "verbetes/pyramid-of-pain.md" },
      ] },
      { "MITRE" = [
          { "MITRE ATT&CK" = "verbetes/mitre-attack.md" },
          { "MITRE D3FEND" = "verbetes/mitre-d3fend.md" },
          { "MITRE ATLAS" = "verbetes/mitre-atlas.md" },
      ] },
      { "Compartilhamento e avaliação de fontes" = [
          { "Protocolo de Semáforo (TLP)" = "verbetes/traffic-light-protocol.md" },
          { "Protocolo de Ações Permissíveis (PAP)" = "verbetes/permissible-actions-protocol.md" },
          { "Admiralty Code" = "verbetes/admiralty-code.md" },
      ] },
      { "Padrões de detecção e troca" = [
          { "STIX" = "verbetes/stix.md" },
          { "TAXII" = "verbetes/taxii.md" },
          { "YARA" = "verbetes/yara.md" },
          { "Sigma" = "verbetes/sigma.md" },
      ] },
      { "Conceitos e estratégia" = [
          { "Ameaça Persistente Avançada (APT)" = "verbetes/advanced-persistent-threat.md" },
          { "Escala Deslizante de Segurança Cibernética" = "verbetes/sliding-scale-of-cyber-security.md" },
          { "VERIS" = "verbetes/veris.md" },
          { "Indicador de Comprometimento (IOC)" = "verbetes/indicador-de-comprometimento.md" },
          { "Inteligência de Fontes Abertas (OSINT)" = "verbetes/osint.md" },
          { "EPSS" = "verbetes/epss.md" },
      ] },
  ] },
  { "Ecossistema" = [
      { "Instituições" = "ecossistema/instituicoes.md" },
      { "Legislação" = [
          { "E-Ciber" = "ecossistema/legislacao/e-ciber.md" },
          { "PNCiber" = "ecossistema/legislacao/pnciber.md" },
          { "PNSI" = "ecossistema/legislacao/pnsi.md" },
          { "REGIC" = "ecossistema/legislacao/regic.md" },
      ] },
  ] },
  { "Glossário" = "glossario.md" },
  { "Contribuir" = "contribuir.md" },
]

[project.plugins.macros]
render_by_default = false
force_render_paths = """
recursos/*.md
ecossistema/**/*.md
"""

[project.theme]
custom_dir = "overrides"
language = "pt-BR"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Usar modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Usar modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Usar preferência do sistema"
