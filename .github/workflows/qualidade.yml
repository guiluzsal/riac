name: Qualidade

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  links:
    name: Links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verificar links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "**/*.md" "data/*.yaml"
          fail: true

  schema:
    name: Schema do catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install check-jsonschema
      - run: >-
          check-jsonschema --schemafile schemas/recursos.schema.json
          data/recursos.yaml

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  ortografia:
    name: Ortografia (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - uses: streetsidesoftware/cspell-action@v8
        with:
          config: "./cspell.json"
          files: "**/*.md"

  build:
    name: zensical build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install zensical
      - run: zensical build --clean
